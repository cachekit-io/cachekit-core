name: Attestation Health Check

on:
  schedule:
    - cron: '23 3 * * 1'  # Weekly Monday 3:23am UTC
  workflow_dispatch:

# Never cancel: a dispatch landing during the Monday cron would otherwise leave two
# runs racing to file the same failure issue.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Latest Release Attestations
    # ubuntu-latest, NOT the self-hosted `cachekit` runner: the ARC pods have no `gh`
    # binary (LAB-899) and unreliable Sigstore (Fulcio/Rekor) egress — the same reason
    # release.yml's publish job is hosted. `gh attestation verify` is the only tool
    # that does Sigstore bundle verification, so moving this job back to ARC silently
    # re-breaks it (LAB-984: every `gh` call exited 127 into `|| echo ""`, and the job
    # reported green while verifying nothing for weeks).
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      # github-script, not `gh`, for API calls — the convention release.yml documents
      # on its "Assign release PR" step. `gh` is confined to Sigstore verification below.
      - name: Resolve latest release
        id: release
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            let tagName;
            try {
              const { data } = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              tagName = data.tag_name;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
              // A 404 here does NOT mean "no releases". getLatestRelease returns the
              // latest non-draft, non-prerelease release, so a repo whose releases are
              // all drafts or prereleases 404s too. Skipping on a bare 404 would be a
              // silent green — the exact fail-open this file was rewritten to remove.
              // Only a genuinely empty release list may skip.
              const { data: releases } = await github.rest.repos.listReleases({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 1,
              });
              if (releases.length > 0) {
                core.setFailed(
                  'No published full release, but the repository has draft/prerelease releases. ' +
                  'Nothing verifiable — refusing to report green.',
                );
                return;
              }
              core.info('Repository has no releases at all — nothing to verify.');
              core.setOutput('skip', 'true');
              return;
            }
            // release-please tags this crate `<package-name>-v<semver>`
            // (release-please-config.json: package-name cachekit-core, release-type rust).
            // The character classes are deliberately tight: these values build a URL and
            // a file path, so `/` and shell metacharacters must not survive parsing.
            const match = /^(?<crate>[A-Za-z0-9_-]+)-v(?<version>\d+\.\d+\.\d+[0-9A-Za-z.+-]*)$/
              .exec(tagName);
            if (!match) {
              core.setFailed(`Cannot derive crate name and version from release tag '${tagName}'`);
              return;
            }
            core.setOutput('skip', 'false');
            core.setOutput('tag', tagName);
            core.setOutput('crate', match.groups.crate);
            core.setOutput('version', match.groups.version);
            core.info(`Latest release ${tagName} -> crate ${match.groups.crate} version ${match.groups.version}`);

      # The attestation subject is the `.crate` release.yml hands to
      # attest-build-provenance / attest-sbom (`target/package/*.crate`) — the identical
      # file `cargo publish` uploads. crates.io holds that byte-identical copy, and this
      # repo publishes no GitHub release assets, so crates.io is the artifact source.
      #
      # `curl -f` with no `|| true`: a tagged release whose crate never reached crates.io
      # is a real supply-chain gap, so it must fail the job rather than degrade to a skip.
      - name: Download attested crate from crates.io
        if: steps.release.outputs.skip != 'true'
        id: artifact
        env:
          CRATE: ${{ steps.release.outputs.crate }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir -p release-assets
          ARTIFACT="release-assets/${CRATE}-${VERSION}.crate"
          # -A is mandatory, not politeness: crates.io answers 403 to a generic user
          # agent (verified — plain `curl/8.x` gets 403 on this exact URL).
          curl -fsSL --retry 3 --retry-connrefused \
            -A "cachekit-core-attestation-check (+https://github.com/${GITHUB_REPOSITORY})" \
            "https://crates.io/api/v1/crates/${CRATE}/${VERSION}/download" \
            -o "$ARTIFACT"
          test -s "$ARTIFACT"
          echo "path=$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "Downloaded $ARTIFACT ($(wc -c < "$ARTIFACT") bytes, sha256 $(sha256sum "$ARTIFACT" | cut -d' ' -f1))"

      # Identity pinning takes BOTH flags. `--signer-workflow` is an unanchored prefix
      # match on the certificate SAN (verified: a truncated `.../release` with no `.yml`
      # also passes), so on its own it pins neither the ref nor the full filename — an
      # actor with push access could mint provenance from a modified release.yml on any
      # branch and this check would bless it. `--source-ref` is what asserts "built by
      # the release pipeline on main", which is the only claim worth making here.
      #
      # `--format json --jq` is the evidence trail, not decoration: verified by
      # redirecting output, a passing `gh attestation verify` prints NOTHING and exits 0,
      # which in a log is indistinguishable from the skip this job used to do. The jq
      # line names the digest that was actually verified.
      - name: Verify provenance attestation
        if: steps.release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT: ${{ steps.artifact.outputs.path }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          echo "Verifying SLSA provenance for $TAG"
          gh attestation verify "$ARTIFACT" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref refs/heads/main \
            --predicate-type https://slsa.dev/provenance/v1 \
            --format json \
            --jq '.[] | "verified provenance: digest=\(.verificationResult.statement.subject[0].digest.sha256) predicate=\(.verificationResult.statement.predicateType) signer=\(.verificationResult.signature.certificate.buildSignerURI)"'

      # Predicate type is the UNVERSIONED `https://cyclonedx.org/bom` — that is what
      # actions/attest-sbom emits for the CycloneDX 1.6 document release.yml generates.
      # Do not "fix" this to `.../bom/v1.6`: nothing matches that, nor SPDX. There is no
      # second SBOM predicate to fall back to, so there is no fallback — verified or red.
      - name: Verify SBOM attestation
        if: steps.release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT: ${{ steps.artifact.outputs.path }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          echo "Verifying CycloneDX SBOM attestation for $TAG"
          gh attestation verify "$ARTIFACT" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref refs/heads/main \
            --predicate-type https://cyclonedx.org/bom \
            --format json \
            --jq '.[] | "verified SBOM: digest=\(.verificationResult.statement.subject[0].digest.sha256) predicate=\(.verificationResult.statement.predicateType) signer=\(.verificationResult.signature.certificate.buildSignerURI)"'

      # Verification above proves the latest GitHub release's crate is authentic — but
      # says nothing about whether that is the version `cargo add` actually resolves.
      # A hand-published newer version, a prerelease-skipped release, or a yank all
      # leave the steps above green while users install something this job never
      # checked (LAB-1036). max_stable_version is what cargo resolves by default, so
      # verified != max_stable is a false green and must go red.
      #
      # The one legitimate mismatch is the release→publish window: release.yml creates
      # the GitHub release BEFORE `cargo publish` runs, so for a few minutes the tag
      # can lead crates.io. That state is tolerated only when BOTH hold: the verified
      # (GitHub) side of the mismatch is the newer one, AND a release.yml run is
      # observably queued or in progress right now. A positive observation, not an
      # error-swallow — if crates.io trails with no release run in flight, the publish
      # died, which is exactly the gap this step exists to catch.
      - name: Check crates.io serves the verified version
        if: steps.release.outputs.skip != 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CRATE: ${{ steps.release.outputs.crate }}
          VERSION: ${{ steps.release.outputs.version }}
        with:
          script: |
            const crate = process.env.CRATE;
            const version = process.env.VERSION;
            // Same mandatory descriptive UA as the download step: crates.io answers
            // 403 to a generic user agent.
            const res = await fetch(`https://crates.io/api/v1/crates/${crate}`, {
              headers: {
                'User-Agent': `cachekit-core-attestation-check (+https://github.com/${process.env.GITHUB_REPOSITORY})`,
              },
            });
            if (!res.ok) {
              core.setFailed(`crates.io API answered ${res.status} for crate '${crate}' — cannot confirm what users install.`);
              return;
            }
            const data = await res.json();

            const entry = (data.versions || []).find((v) => v.num === version);
            if (entry && entry.yanked) {
              core.setFailed(
                `Verified version ${version} is YANKED on crates.io — this check just green-lit ` +
                'a version users are steered away from, so the latest GitHub release no longer matches a servable crate.',
              );
              return;
            }

            const maxStable = data.crate.max_stable_version;
            if (!maxStable) {
              core.setFailed(`crates.io reports no stable version of '${crate}' at all (every version yanked or prerelease).`);
              return;
            }
            if (maxStable === version) {
              core.info(`crates.io max_stable_version ${maxStable} == verified ${version} — the verified crate is what 'cargo add ${crate}' installs.`);
              return;
            }

            // Numeric x.y.z comparison. Both sides are stable cargo versions: the tag
            // regex above guarantees the verified triple, max_stable_version by
            // definition has no prerelease part.
            const triple = (v) => v.split('.').slice(0, 3).map((n) => parseInt(n, 10));
            const [a, b] = [triple(version), triple(maxStable)];
            const verifiedIsNewer = a[0] !== b[0] ? a[0] > b[0] : a[1] !== b[1] ? a[1] > b[1] : a[2] > b[2];

            if (verifiedIsNewer) {
              const { data: runs } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'release.yml',
                per_page: 20,
              });
              const inFlight = runs.workflow_runs.filter((r) =>
                ['queued', 'in_progress', 'waiting', 'pending', 'requested'].includes(r.status),
              );
              if (inFlight.length > 0) {
                core.info(
                  `crates.io max_stable_version (${maxStable}) trails verified ${version} while release.yml run(s) ` +
                  `${inFlight.map((r) => `#${r.run_number}`).join(', ')} are in flight — release→publish window, not a failure.`,
                );
                return;
              }
            }
            core.setFailed(
              `crates.io max_stable_version is ${maxStable} but this check verified ${version}. ` +
              `Users running 'cargo add ${crate}' get ${maxStable}, a version this job never verified — a false green (LAB-1036).`,
            );

      # GitHub silently disables `schedule:` triggers in public repos after ~60 days
      # without repository activity — after which this job's failure mode becomes
      # "not running at all", indistinguishable from passing quietly (LAB-1036). Fail
      # while the schedule is still alive so the auto-disable is preceded by a red run
      # and a tracking issue instead of a quiet death. The threshold is 50 days, not
      # ~55: the cron is weekly, so any margin narrower than 7 days can be jumped
      # over entirely (green at day 54, disabled before the next run at day 61) —
      # 50 guarantees at least one red run inside the [50, 60) window. No `if:` on
      # the release skip output: liveness is independent of whether releases exist.
      - name: Assert schedule liveness
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { data: repo } = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const staleDays = (Date.now() - Date.parse(repo.pushed_at)) / 86400000;
            if (staleDays > 50) {
              core.setFailed(
                `Last repository push was ${staleDays.toFixed(1)} days ago; GitHub auto-disables this schedule at ` +
                '~60 days of inactivity, after which the check stops running with no signal at all. ' +
                'Push activity (or re-enable the workflow) before it goes dark.',
              );
              return;
            }
            core.info(`Last push ${staleDays.toFixed(1)} days ago — schedule is not at risk of the 60-day auto-disable.`);

      # Weekly job: without dedupe one unfixed break files a fresh issue every Monday,
      # and a muted `bug` label is itself a fail-open alert channel. The marker is
      # per-tag, so a NEW tag's failure still alerts instead of hiding behind the open
      # issue for the old one. Matched on body, not title or label, so a human
      # retitling or relabelling the issue cannot break dedupe. The 100-issue page is
      # ample here; worst case is a duplicate issue, never a missed alert.
      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          TAG: ${{ steps.release.outputs.tag }}
        with:
          script: |
            const tag = process.env.TAG || 'unresolved-release';
            const marker = `<!-- attestation-check:${tag} -->`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = open.find((i) => !i.pull_request && (i.body || '').includes(marker));
            if (existing) {
              core.info(`Issue #${existing.number} already tracks ${tag}; not filing a duplicate. Run: ${runUrl}`);
              return;
            }
            const { data: created } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Attestation verification failed for ${tag}`,
              body: [
                marker,
                `The weekly attestation health check failed for \`${tag}\`.`,
                '',
                `Run: ${runUrl}`,
                '',
                'Check that release.yml produced valid SLSA provenance and CycloneDX SBOM',
                'attestations for the published `.crate`, that it ran on `main`, that the',
                'crate actually reached crates.io for this tag, that crates.io\'s',
                '`max_stable_version` still matches this release (nothing hand-published,',
                'yanked, or prerelease-skipped), and that the repository has push activity',
                'within the last 50 days (GitHub auto-disables the schedule at ~60).',
              ].join('\n'),
              labels: ['bug'],
            });
            core.info(`Opened tracking issue #${created.number}`);
